services:
  - type: web
    name: triagenet-backend
    runtime: python
    region: oregon
    plan: free          # Upgrade to Starter for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: triagenet-postgres
          property: connectionString
      - key: AZURE_OPENAI_ENDPOINT
        sync: false      # Set manually in Render dashboard
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        value: gpt-4o
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-02-15-preview
      - key: COSMOSDB_ENDPOINT
        sync: false
      - key: COSMOSDB_KEY
        sync: false
      - key: SERVICEBUS_CONNECTION_STRING
        sync: false
      - key: AISEARCH_ENDPOINT
        sync: false
      - key: AISEARCH_API_KEY
        sync: false
      - key: REDIS_CONNECTION_STRING
        sync: false

databases:
  - name: triagenet-postgres
    databaseName: triagenet
    user: triagenet
    plan: free